[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent for home-service errands: approvals, idempotency, recovery."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
errand = "errand.cli:main"

[tool.setuptools.packages.find]
include = ["errand*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
